<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Shutter &amp; Lace</title>
<link rel="stylesheet" href="style.css"><script src="analytics.js"></script></head>
<body><div class="auth">
  <aside class="auth-art" style="--img:url(images/hallway.jpg)"><q>The lanterns are lit. Come inside.</q></aside>
  <main class="auth-form">
    <a class="logo" href="/">Shutter <i>&amp;</i> Lace</a>
    <form id="f" novalidate>
      <h1>Welcome back</h1><p class="sub">Log in to see your account and saved pieces.</p>
      <label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn fill" type="submit">Log in</button>
      <p class="alt">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main></div>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg');
f.addEventListener('submit',async e=>{
  e.preventDefault(); msg.textContent='';
  const body=Object.fromEntries(new FormData(f));
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok){track('login',{method:'email'});location.href=d.redirect||'/';} else msg.textContent=d.error||'Something went wrong.';
});
</script></body></html>
